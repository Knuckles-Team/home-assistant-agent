[bumpversion]
current_version = 2.1.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file(readme-img-tag):README.md]
search = knucklessg1/home-assistant-agent:{current_version}
replace = knucklessg1/home-assistant-agent:{new_version}

[bumpversion:file(readme-img-tag-short):README.md]
search = agent (`:{current_version}`)
replace = agent (`:{new_version}`)

[bumpversion:file(mcp-img):docker/Dockerfile]
search = home-assistant-agent[mcp]=={current_version}
replace = home-assistant-agent[mcp]=={new_version}

[bumpversion:file(agent-img):docker/Dockerfile]
search = home-assistant-agent[agent]=={current_version}
replace = home-assistant-agent[agent]=={new_version}

[bumpversion:file:home_assistant_agent/agent_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:home_assistant_agent/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
